<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Orders - Admin</title>

  <!-- LINK YOUR EXISTING CSS -->
  <link rel="stylesheet" href="admin.css">

 <style>
/* 🌈 BACKGROUND */
body {
  background: linear-gradient(135deg, #c9ada7, #9a8c98);
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  padding: 20px;
  color: #fff;
}

/* 🧱 HEADER */
.header {
  text-align: center;
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 20px;
}

/* 📦 CONTAINER */
.container {
  max-width: 900px;
  margin: auto;
}

/* 🔘 BUTTONS */
.back-btn, #showAllBtn {
  padding: 10px 18px;
  border-radius: 25px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  margin: 5px;
  transition: 0.3s;
}

.back-btn {
  background: #fff;
  color: #ff4d4d;
  text-decoration: none;
}

.back-btn:hover {
  transform: scale(1.05);
}

#showAllBtn {
  background: #222;
  color: #fff;
}

#showAllBtn:hover {
  background: #ff4d4d;
}

/* 🔍 SEARCH */
#searchOrder {
  width: 350px;
  display: block;
  margin: 15px auto;
  padding: 12px 18px;
  border-radius: 30px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.8);
  font-size: 14px;
}

/* 🧾 ORDER CARD */
.order-card {
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  padding: 20px;
  margin: 15px 0;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  transition: 0.3s;
}

.order-card:hover {
  transform: translateY(-5px) scale(1.01);
}

/* 👤 NAME */
.order-card h3 {
  font-size: 20px;
  margin-bottom: 8px;
}

/* 🔥 BADGE */
.latest-badge {
  background: #ff4d4d;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  margin-left: 10px;
}

/* 📄 TEXT */
.order-card p {
  margin: 5px 0;
  font-size: 14px;
  opacity: 0.9;
}

/* 🧾 ITEMS */
.order-card ul {
  margin: 10px 0;
  padding-left: 20px;
}

.order-card li {
  font-size: 13px;
}

/* 💰 TOTAL */
.order-card b {
  color: #ffd369;
  font-size: 16px;
}

/* 📦 STATUS */
.status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 10px;
  background: #333;
  font-size: 12px;
  margin-top: 5px;
}

/* 📱 RESPONSIVE */
@media (max-width: 600px) {
  #searchOrder {
    width: 90%;
  }
}



.dashboard {
  display: flex;
  gap: 15px;
  justify-content: center;
  margin-bottom: 20px;
}

.dashboard .card {
  background: rgba(255,255,255,0.2);
  padding: 15px 25px;
  border-radius: 15px;
  text-align: center;
  backdrop-filter: blur(10px);
}

.dashboard h3 {
  font-size: 22px;
  margin: 0;
}

.dashboard p {
  font-size: 12px;
  opacity: 0.8;
}



button {
  padding: 6px 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

button:hover {
  opacity: 0.8;
}



/* STATUS COLORS */
.status {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: bold;
}

/* 🟡 Pending */
.status.pending {
  background: #ffd369;
  color: #000;
}

/* 🟢 Delivered */
.status.delivered {
  background: #4caf50;
  color: #fff;
}

/* 🔴 Cancelled (optional) */
.status.cancelled {
  background: #ff4d4d;
  color: #fff;
}


</style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    📦 All Orders
  </div>

  <!-- MAIN -->
  <div class="container">

    <!-- BACK BUTTON -->
    <a href="admin.html" class="back-btn">⬅ Back to Admin</a>

    <button id="showAllBtn" style="
  padding:8px 15px;
  border:none;
  border-radius:20px;
  background:#333;
  color:#fff;
  cursor:pointer;
  margin-bottom:10px;
">
  📦 Show All Orders
</button>




<div class="dashboard">
  <div class="card">
    <h3 id="totalOrders">0</h3>
    <p>Total Orders</p>
  </div>

  <div class="card">
    <h3 id="totalRevenue">₹0</h3>
    <p>Total Revenue</p>
  </div>
</div>



    <!-- ORDER LIST -->
     <input type="text" id="searchOrder" placeholder="🔍 Search by name, email, phone, date..." />
    <div id="orderList">
      <!-- Orders will load here -->
    </div>

  </div>

  <!-- JS FILE -->
  <script type="module" src="order.js"></script>

</body>
</html>
